schema: flowprint/2.0
name: shopify_order_processing
version: '1.0.0'
description: >-
  Process incoming Shopify orders: classify line items by SKU,
  route to the appropriate handler (test, care, treatment refill,
  ungated Rx), then send to Berlin for fulfillment.
lanes:
  shopify:
    label: Shopify
    visibility: external
    order: 0
  order_processing:
    label: Order Processing
    visibility: internal
    order: 1
  fulfillment:
    label: Fulfillment
    visibility: internal
    order: 2
nodes:
  receive_order:
    type: action
    lane: shopify
    label: Receive Webhook
    description: HMAC-verified Shopify webhook (orders/create, orders/cancelled)
    entry_points:
      - file: stubs/shopify-order/webhooks.js
        symbol: shopifyWebhookHandler
    next: extract_order_data

  extract_order_data:
    type: action
    lane: shopify
    label: Extract Order Data
    description: >-
      Parse payload: line items, email, shipping address,
      note_attributes (_evvyAccountEmail, checkout_source,
      parent_order_number, bulk_order_id)
    entry_points:
      - file: stubs/shopify-order/extract.js
        symbol: extractOrderData
    next: classify_line_items

  classify_line_items:
    type: action
    lane: order_processing
    label: Classify Line Items
    description: >-
      Map each SKU to an order_type and business_vertical using
      the SKU classification decision table (based on Evvy's
      _get_order_type_from_sku logic)
    rules:
      file: shopify-sku-classification.rules.yaml
    next: route_by_order_type

  route_by_order_type:
    type: switch
    lane: order_processing
    label: Route by Order Type
    description: >-
      Route to the appropriate handler based on the classified
      order_type. Maps to Evvy's process_shopify_order_for_* functions.
    rules:
      file: shopify-order-routing.rules.yaml
    default: handle_unknown

  process_test_order:
    type: action
    lane: fulfillment
    label: Process Test Order
    description: >-
      Create Test records, handle bulk orders (qty >= 3 with provider
      discount tiers), link provider test orders, fire Braze events
    entry_points:
      - file: stubs/shopify-order/test-order.js
        symbol: processTestOrder
    next: send_to_fulfillment

  process_care_order:
    type: action
    lane: fulfillment
    label: Process Care Order
    description: >-
      Link to consult via consult_uid, create ConsultOrder record,
      add ordered treatments to consult selection, handle a-la-carte
      / dynamic-bundle / mixed-care purchase types
    entry_points:
      - file: stubs/shopify-order/care-order.js
        symbol: processCareOrder
    next: send_to_fulfillment

  process_treatment_refill:
    type: action
    lane: fulfillment
    label: Process Treatment Refill
    description: >-
      Resolve prescriptions, validate state restrictions on shipping
      address, send to Precision pharmacy via async task
    entry_points:
      - file: stubs/shopify-order/treatment-refill.js
        symbol: processTreatmentRefill
    error:
      retry:
        limit: 3
        backoff: exponential
      catch: handle_error
    next: send_to_fulfillment

  check_ungated_rx:
    type: switch
    lane: order_processing
    label: Check Ungated Rx
    description: >-
      If user has valid, refillable prescriptions for all Rx products,
      route to direct refill. Otherwise, create/link to consult for
      intake and prescription generation.
    cases:
      - when: can_refill
        next: process_treatment_refill
      - when: needs_consult
        next: process_care_order
    default: handle_error

  handle_unknown:
    type: action
    lane: order_processing
    label: Handle Unknown SKU
    description: Save order for manual investigation
    entry_points:
      - file: stubs/shopify-order/unknown.js
        symbol: processUnknownSku
    next: handle_error

  send_to_fulfillment:
    type: action
    lane: fulfillment
    label: Send to Berlin
    description: >-
      Send order to Berlin fulfillment system, fire any-paid event,
      process gift cards, log payment metrics
    entry_points:
      - file: stubs/shopify-order/fulfillment.js
        symbol: sendToBerlin
    next: order_complete

  handle_error:
    type: error
    lane: order_processing
    label: Handle Error
    description: Create ConsultTask for manual intervention
    next: order_failed

  order_complete:
    type: terminal
    lane: shopify
    label: Order Complete
    outcome: success

  order_failed:
    type: terminal
    lane: shopify
    label: Order Failed
    outcome: failure
