schema: flowprint/1.0
name: consultation-flow
version: '1.0.0'
description: Patient consultation flow with triage, specialist routing, and multiple outcomes
metadata:
  owner: clinical-ops
  domain: telehealth
workflow:
  task_queue: consultation-tasks
  execution_timeout: 4h
  input_type: ConsultationInput
  input_type_import: ./types

lanes:
  patient:
    label: Patient
    visibility: external
    order: 0
  triage:
    label: Triage & Routing
    visibility: external
    order: 1
  specialist:
    label: Specialist Services
    visibility: internal
    order: 2
  support:
    label: Support Systems
    visibility: internal
    order: 3

nodes:
  initiate_consultation:
    type: action
    lane: patient
    label: Initiate Consultation
    description: Patient submits consultation request with symptoms and history
    entry_points:
      - file: backend/consults/api.py
        symbol: create_consultation
    inputs:
      patient_id: input.patient_id
      symptoms: input.symptoms
    temporal:
      start_to_close_timeout: 30s
    next: collect_intake

  collect_intake:
    type: action
    lane: patient
    label: Collect Intake Information
    entry_points:
      - file: backend/consults/intake.py
        symbol: process_intake_form
    inputs:
      consultation_id: initiate_consultation.id
    temporal:
      start_to_close_timeout: 1m
    next: triage_assessment

  triage_assessment:
    type: switch
    lane: triage
    label: Triage Assessment
    description: Clinical rules engine evaluates urgency and routes to appropriate path
    cases:
      - when: input.urgency === 'emergency'
        next: escalate_emergency
      - when: input.urgency === 'urgent'
        next: urgent_consult
      - when: input.category === 'dermatology'
        next: route_specialist_consults
      - when: input.category === 'general'
        next: route_specialist_consults
      - when: input.category === 'mental_health'
        next: mental_health_screening
    default: route_specialist_consults

  escalate_emergency:
    type: action
    lane: triage
    label: Escalate to Emergency Services
    description: Redirect patient to emergency care and notify on-call provider
    entry_points:
      - file: backend/consults/emergency.py
        symbol: escalate_to_emergency
    compensation:
      file: backend/consults/emergency.py
      symbol: cancel_escalation
    temporal:
      start_to_close_timeout: 10s
      retry:
        max_attempts: 3
        backoff_coefficient: 2
        initial_interval: 1s
    next: emergency_referral_complete

  emergency_referral_complete:
    type: terminal
    lane: patient
    label: Emergency Referral Issued
    outcome: success

  urgent_consult:
    type: action
    lane: specialist
    label: Schedule Urgent Consultation
    entry_points:
      - file: backend/scheduling/service.py
        symbol: schedule_urgent
    temporal:
      start_to_close_timeout: 30s
      schedule_to_close_timeout: 2m
      heartbeat_timeout: 10s
      retry:
        max_attempts: 5
        backoff_coefficient: 1.5
        initial_interval: 2s
        max_interval: 30s
        non_retryable_errors:
          - ProviderNotLicensed
          - PatientNotEligible
    next: await_provider_availability
    error:
      catch: scheduling_failed

  await_provider_availability:
    type: wait
    lane: specialist
    label: Await Provider Availability
    event: provider.available
    event_type: ProviderAvailableSignal
    event_type_import: ./signals
    timeout: 2h
    next: conduct_consultation
    timeout_next: scheduling_failed

  scheduling_failed:
    type: error
    lane: triage
    label: Handle Scheduling Failure
    description: No provider available within SLA window
    entry_points:
      - file: backend/notifications/service.py
        symbol: send_scheduling_failure_alert
    next: consultation_incomplete

  mental_health_screening:
    type: action
    lane: specialist
    label: Mental Health Screening
    description: Automated screening questionnaire before specialist routing
    entry_points:
      - file: backend/consults/mental_health.py
        symbol: run_screening
    temporal:
      start_to_close_timeout: 5m
    next: evaluate_screening

  evaluate_screening:
    type: switch
    lane: specialist
    label: Evaluate Screening Results
    cases:
      - when: mental_health_screening.severity === 'crisis'
        next: escalate_emergency
      - when: mental_health_screening.needs_specialist === true
        next: route_specialist_consults
      - when: mental_health_screening.self_guided === true
        next: assign_self_care_plan
    default: route_specialist_consults

  assign_self_care_plan:
    type: action
    lane: patient
    label: Assign Self-Care Plan
    entry_points:
      - file: backend/care/plans.py
        symbol: assign_self_care
    next: consultation_complete

  route_specialist_consults:
    type: parallel
    lane: specialist
    label: Route Specialist Consultations
    description: Fan out to specialist review and documentation preparation simultaneously
    branches:
      - assign_specialist
      - prepare_documentation
    join: conduct_consultation
    join_strategy: all

  assign_specialist:
    type: action
    lane: specialist
    label: Assign Specialist
    entry_points:
      - file: backend/scheduling/service.py
        symbol: assign_specialist_provider
    compensation:
      file: backend/scheduling/service.py
      symbol: release_specialist
    temporal:
      start_to_close_timeout: 1m
    next: conduct_consultation
    error:
      catch: scheduling_failed

  prepare_documentation:
    type: action
    lane: support
    label: Prepare Patient Documentation
    entry_points:
      - file: backend/records/service.py
        symbol: compile_patient_record
    temporal:
      start_to_close_timeout: 2m
    next: conduct_consultation

  conduct_consultation:
    type: action
    lane: specialist
    label: Conduct Consultation
    entry_points:
      - file: backend/consults/service.py
        symbol: start_consultation_session
    next: determine_outcome

  determine_outcome:
    type: switch
    lane: specialist
    label: Determine Consultation Outcome
    cases:
      - when: conduct_consultation.outcome === 'treatment_prescribed'
        next: generate_treatment_plan
      - when: conduct_consultation.outcome === 'follow_up_needed'
        next: schedule_follow_up
      - when: conduct_consultation.outcome === 'referred_out'
        next: external_referral
      - when: conduct_consultation.outcome === 'resolved'
        next: consultation_complete
    default: generate_treatment_plan

  generate_treatment_plan:
    type: action
    lane: specialist
    label: Generate Treatment Plan
    entry_points:
      - file: backend/care/plans.py
        symbol: create_treatment_plan
    next: deliver_results

  schedule_follow_up:
    type: action
    lane: specialist
    label: Schedule Follow-Up
    entry_points:
      - file: backend/scheduling/service.py
        symbol: schedule_follow_up
    next: deliver_results

  external_referral:
    type: action
    lane: support
    label: Process External Referral
    entry_points:
      - file: backend/referrals/service.py
        symbol: create_external_referral
    next: deliver_results
    error:
      catch: referral_failed

  referral_failed:
    type: error
    lane: triage
    label: Handle Referral Failure
    entry_points:
      - file: backend/notifications/service.py
        symbol: send_referral_failure_notice
    next: consultation_incomplete

  deliver_results:
    type: action
    lane: patient
    label: Deliver Results to Patient
    entry_points:
      - file: backend/notifications/service.py
        symbol: send_consultation_results
    next: consultation_complete

  consultation_complete:
    type: terminal
    lane: patient
    label: Consultation Complete
    outcome: success

  consultation_incomplete:
    type: terminal
    lane: patient
    label: Consultation Incomplete
    outcome: failure
