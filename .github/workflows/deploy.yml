name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        default: artifacts
        options:
          - artifacts
          - vercel
          - cloudflare
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @ruminaider/flowprint-schema build
          pnpm --filter @ruminaider/flowprint-editor build
          pnpm --filter flowprint-app build

      - name: Upload app dist
        uses: actions/upload-artifact@v4
        with:
          name: flowprint-app-dist
          path: packages/app/dist/

  deploy-artifacts:
    name: Deploy Artifacts
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || inputs.target == 'artifacts'

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flowprint-app-dist
          path: flowprint-app-dist

      - name: Create tarball
        run: tar -czf flowprint-app.tar.gz -C flowprint-app-dist .

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowprint-app-tarball
          path: flowprint-app.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flowprint-app.tar.gz

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: inputs.target == 'vercel'
    environment: vercel

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flowprint-app-dist
          path: flowprint-app-dist

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Placeholder: configure VERCEL_ORG_ID, VERCEL_PROJECT_ID, and
      # VERCEL_TOKEN secrets in the repository settings before using.
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: inputs.target == 'cloudflare'
    environment: cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: flowprint-app-dist
          path: flowprint-app-dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy flowprint-app-dist --project-name=flowprint-app
